<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/images/2favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="EventBox - drustvena mreza za dogadjaje" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Content-Security-Policy: bela lista odakle stranica sme da ucita skripte/stilove/slike/konekcije.
         %API_ORIGIN% i %API_WS_ORIGIN% zamenjuje vite.config.js adresom backenda iz VITE_API_URL
         (.env za razvoj, .env.production za produkciju) - ovde se adresa ne pise rucno. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://maps.googleapis.com https://maps.gstatic.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://maps.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https: %API_ORIGIN%;
      connect-src 'self' %API_ORIGIN% %API_WS_ORIGIN% https://maps.googleapis.com;
      frame-src 'none';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <!-- CSS: ucitava se globalno iz public/css (stara tema + nove komponente u style.css) -->
    <!-- osnova.css: reset + grid izvucen iz Bootstrap-a (ranije ceo Bootstrap sa CDN-a); ikone: samo Line Awesome (la la-*) -->
    <link rel="stylesheet" type="text/css" href="/css/osnova.css" />
    <link rel="stylesheet" type="text/css" href="/css/line-awesome.min.css" />
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
    <link rel="stylesheet" type="text/css" href="/css/responsive.css" />

    <!-- Google Maps skriptu sad ucitava @vis.gl/react-google-maps (<APIProvider>,
         src/maps.jsx) - rucni <script> tag ovde bi je ucitao DVAPUT i Google
         baca gresku na to. Kljuc ide kroz VITE_GOOGLE_MAPS_API_KEY u .env. -->

    <title>EventBox</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
